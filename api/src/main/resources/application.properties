spring.application.name=ressources-relationnelles-api

# ── Base de données ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ressources_relationnelles?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────────────────────
# Clé secrète : au moins 256 bits (32 caractères). CHANGEZ-LA en production !
jwt.secret=ZVJlc3NvdXJjZXNSZWxhdGlvbm5lbGxlc1NlY3JldEtleVN1cGVyU2VjdXJl
# Durée de validité du token : 24h en millisecondes
jwt.expiration=86400000

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# ── CORS ─────────────────────────────────────────────────────────────────────
# Origines autorisées (séparées par virgule). En dev : *, en prod : vos domaines.
cors.allowed-origins=*

# ── Pagination ────────────────────────────────────────────────────────────────
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
